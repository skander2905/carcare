# Local development stack: `docker compose up`.
#
# Every service is health-gated, so the API never starts against a database
# that is still initialising — the classic source of flaky first-run failures.

name: carcare

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carcare}
      POSTGRES_DB: ${POSTGRES_DB:-carcare}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-carcare} -d ${POSTGRES_DB:-carcare}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Append-only so queued jobs survive a restart of the container.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. The API starts using it in Phase 8 (documents);
  # it runs from the start so the local environment never has to change shape.
  # MinIO stopped publishing images to Docker Hub (minio/minio and minio/mc now
  # 404). Chainguard's rebuild is the same server, kept current. It ships no
  # shell and no `mc`, so there is no in-container healthcheck; minio-init
  # below retries until the server answers instead.
  minio:
    image: chainguard/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-carcare}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-carcare-dev-secret}
      # Browsers upload straight here from the web app, so the web origin must
      # pass CORS. MinIO applies CORS server-wide rather than per bucket, and
      # defaults to allowing every origin; this pins it to the one that should
      # be uploading. The API's own CORS settings do not reach the store.
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_APP_URL:-http://localhost:3000}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      # The image runs as uid 65532; its /data is world-writable, so a fresh
      # named volume inherits permissions it can write to.
      - minio-data:/data

  # One-shot: creates the bucket, then exits. Retried on failure because the
  # server may not be accepting connections yet, and there is no healthcheck
  # to wait on. `mc` takes its alias from MC_HOST_<name>, since the image has
  # no shell to run `mc alias set` first.
  minio-init:
    image: chainguard/minio-client:latest
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-carcare}:${MINIO_ROOT_PASSWORD:-carcare-dev-secret}@minio:9000
    command: ['mb', '--ignore-existing', 'local/${S3_BUCKET:-carcare-documents}']
    restart: on-failure:10

  # Migrations run as their own short-lived service rather than inside the API
  # entrypoint. With multiple API replicas, an entrypoint migration means N
  # concurrent `migrate deploy` runs racing on the same advisory lock.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-carcare}:${POSTGRES_PASSWORD:-carcare}@db:5432/${POSTGRES_DB:-carcare}?schema=public
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    restart: 'no'

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: &backend-env
      NODE_ENV: ${NODE_ENV:-development}
      APP_ROLE: api
      PORT: 3001
      API_PREFIX: api
      DATABASE_URL: postgresql://${POSTGRES_USER:-carcare}:${POSTGRES_PASSWORD:-carcare}@db:5432/${POSTGRES_DB:-carcare}?schema=public
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: ${LOG_PRETTY:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      # No `:-default` on purpose: a compose stack without a real secret in
      # .env should fail to boot rather than run on a value published in git.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_ISSUER: ${JWT_ISSUER:-carcare}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-carcare-api}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-carcare_refresh_token}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_REUSE_GRACE_MS: ${REFRESH_REUSE_GRACE_MS:-10000}
      AUTH_RATE_LIMIT_ENABLED: ${AUTH_RATE_LIMIT_ENABLED:-true}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3001}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      # Optional: unset means password-only sign-in.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Receipts and invoices (ADR-009). The API reaches MinIO by its service
      # name; presigned URLs go to the browser, so they are signed for the
      # host port instead.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-carcare-documents}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-carcare}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-carcare-dev-secret}
      S3_FORCE_PATH_STYLE: 'true'
      # Reminder emails (Phase 7). Mailpit catches everything; nothing leaves the machine.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-CarCare <reminders@carcare.local>}
    ports:
      - '${BACKEND_PORT:-3001}:3001'

  # The same image in its other role (architecture.md §2): drains the queues,
  # runs the hourly reminder sweep, sends the email digests. No HTTP port.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *backend-env
      APP_ROLE: worker
    # The image's healthcheck probes HTTP, which a worker does not serve.
    healthcheck:
      disable: true

  # Catches every email the worker sends. Web UI on :8025.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
      args:
        # Baked in at build time — NEXT_PUBLIC_* cannot be changed at runtime.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-3000}:3000'

volumes:
  db-data:
  redis-data:
  minio-data:
