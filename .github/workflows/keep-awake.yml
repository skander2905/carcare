# Keeps the free Render service awake, so the hourly reminder sweep and the
# morning email digests run even when nobody has the app open.
#
# Free Render web services sleep after 15 idle minutes; one request every ten
# wakes or keeps them up. Public repositories get Actions minutes for free.
# GitHub may delay scheduled runs by a few minutes, which is harmless here.
#
# Set the repository variable KEEP_AWAKE_URL (Settings → Secrets and variables
# → Actions → Variables) to the API's /health/live address. Unset, it does nothing.
#
# GitHub disables scheduled workflows after 60 days without a commit; re-enable
# it from the Actions tab if that happens.

name: Keep the API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ vars.KEEP_AWAKE_URL != '' }}
    steps:
      - name: Ping the API
        env:
          URL: ${{ vars.KEEP_AWAKE_URL }}
        # A cold start takes up to a minute; retry rather than fail on the first try.
        run: curl --fail --silent --show-error --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 "$URL"
