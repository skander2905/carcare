name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # Publishes versioned images to GitHub Container Registry. Deployment itself
  # is a separate, explicitly gated job so a green build never deploys by
  # accident before an environment exists.
  publish:
    name: Build & publish images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3001' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # Skipped entirely until a DEPLOY_WEBHOOK_URL secret exists, so the pipeline
  # is green from day one and becomes a real deployment the moment it is set.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [publish]
    if: ${{ github.ref == 'refs/heads/main' }}
    environment:
      name: production

    steps:
      - name: Check deployment target
        id: target
        run: |
          if [ -z "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No DEPLOY_WEBHOOK_URL secret configured — skipping deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Migrations run before the new image serves traffic. They are written to
      # be backwards-compatible with the currently-running version, so a rollback
      # never has to undo a migration (see docs/decisions.md ADR-010).
      - name: Trigger deployment
        if: steps.target.outputs.configured == 'true'
        run: |
          curl --fail --silent --show-error -X POST \
            -H 'Content-Type: application/json' \
            -d '{"sha":"${{ github.sha }}"}' \
            "${{ secrets.DEPLOY_WEBHOOK_URL }}"
